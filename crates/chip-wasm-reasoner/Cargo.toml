[package]
name = "chip-wasm-reasoner"
version = "0.1.0"
edition = "2024"
description = "Host for an untrusted WASM module implementing Chip's LocalReasoner"
license = "MIT"

[dependencies]
chip-core = { path = "../chip-core" }
wasmi = "0.51"

[dev-dependencies]
wat = "1"
fx-core = { path = "../fx-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
