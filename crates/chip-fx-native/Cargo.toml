[package]
name = "chip-fx-native"
version = "0.1.0"
edition = "2024"
description = "Chip's model port over the authoritative FX executor with a native Rust provider (no Node sidecar)"
license = "MIT"

[dependencies]
chip-inference = { path = "../chip-inference" }
chip-fx = { path = "../chip-fx" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
# The authoritative FX and its native provider, pinned by one commit so every FX crate
# in the build is the same copy.
fx-core = { git = "https://github.com/rkendel1/fx", rev = "72ef7a41c5f7b714774ec224c38aa23b53325759" }
fx-single-attempt = { git = "https://github.com/rkendel1/fx", rev = "72ef7a41c5f7b714774ec224c38aa23b53325759" }
fx-native-provider = { git = "https://github.com/rkendel1/fx", rev = "72ef7a41c5f7b714774ec224c38aa23b53325759" }

[dev-dependencies]
chip-core = { path = "../chip-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
