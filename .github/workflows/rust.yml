name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Format, Check, Test, CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Check chip-core for Wasm
        run: cargo check -p chip-core --target wasm32-unknown-unknown

      - name: Build the Wasm decision module
        run: cargo build -p chip-wasm-decision --target wasm32-unknown-unknown --profile wasm-decision

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Run Chip CLI acceptance
        run: cargo run -p chip-cli -- --test

      - name: Wasm decision baseline
        run: cargo run --release -p chip-cli -- --benchmark-wasm-decision 1000

      - name: Local decision model (corpus + footprint)
        run: |
          cargo run --release -p chip-cli -- --evaluate-local-model
          cargo run --release -p chip-cli -- --benchmark-local-model 20000

      - name: Decision corpus generator is current
        run: cargo run -p chip-decision-corpus --bin chip-decision-corpus -- verify

      - name: PR25 report with live inference timings
        run: cargo run --release -p chip-cli -- --report-decision-corpus 20000

      - name: Bounded autonomous work loop
        run: |
          for scenario in completion failure limit turn-limit evidence escalation; do
            cargo run -p chip-cli -- --test-work $scenario
          done
